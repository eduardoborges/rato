[tools]
node = "24"
java = "temurin-21"
"npm:rea-agents" = { version = "6.7.0", postinstall = "$MISE_CONFIG_ROOT/scripts/rea-skill.sh" }

[tools."http:ghidra"]
version = "12.1.4"
url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
checksum = "sha256:ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
postinstall = "$MISE_CONFIG_ROOT/scripts/ghidra-decompiler.sh"

[env]
GHIDRA_INSTALL_DIR = { value = "{% if tools.ghidra %}{{ tools.ghidra.path }}{% endif %}", tools = true }
GHIDRA_HEADLESS_MAXMEM = "8G"
